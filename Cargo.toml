[package]
name = "novels"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
futures = "0.3"
rig = { version = "0.40.0", features = ["derive"] }
schemars = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "json"] }
thiserror = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
